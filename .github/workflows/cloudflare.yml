# Builds the site and publishes it to Cloudflare Pages on every push to main.
# One-time setup: give this repo the secret CLOUDFLARE_API_TOKEN (permission "Cloudflare Pages: Edit").
# Without it, the build runs and the deploy steps are skipped.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT: self-interpreting-bible
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # The account ID is not secret. It is in the dashboard URLs.
  CLOUDFLARE_ACCOUNT_ID: 66bbbf59d9ee8948f770553dfc0d5721

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The build turns the page scans upright with ImageMagick's `convert`.
      - run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - run: npm ci
      # Link each verse to the catechism answers that cite it. If Catechize is not reachable, the site shows no citations.
      - run: node tools/fetch-catechize.mjs
      - run: node build.mjs
      # The homepage (site/) goes over the reader in build/. The merge also writes sitemap.xml and robots.txt.
      - run: npm ci --prefix site
      - run: npm --prefix site run lint
      - run: npm --prefix site run build
      - run: node tools/merge-site.mjs
      # Create the Pages project on the first run. Later runs find it and go on.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages project create "$PROJECT" --production-branch=main || true
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx -y wrangler@4 pages deploy build --project-name="$PROJECT" --branch=main --commit-dirty=true
